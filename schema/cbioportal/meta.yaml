# Schema metadata. In the same pull request as any change to this schema's
# table(s), bump `version` and `date` and add a CHANGELOG.md entry; CI checks
# both. Merging to main tags the commit `<schema>-v<version>`.
# Bump rules (docs/target_schema.md, "Versioning"): major = a field removed or
# renamed, an allowed value removed, col.class changed, a field made required,
# roots narrowed; minor = a field, allowed value or root added, a missing term
# ID filled in; patch = descriptions and typos that change no value.
schema: cbioportal
version: "0.1.0"
date: "2026-11-24"
description: "cBioPortal clinical attributes"
tables:
  - cbioportal_schema.csv
  - cbioportal_schema_clinical_only.csv
  - cbioportal_schema_internal.csv
build:            # table -> artifact prefix for build_schema_artifacts.{py,R}
  cbioportal_schema.csv: cbioportal
lint: report      # report: lint errors are shown; blocking: they fail CI
source: >-
  Google Sheet "cbioportal" tab (rows with mh.use == "T"). Sheet sync stopped
  2026-11-24; the CSV is now the source of truth.
ontologies:       # OLS4 version of each ontology the table cites, when `version` was set
  NCIT: "26.02d"
